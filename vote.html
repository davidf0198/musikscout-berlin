<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vote · musik scout</title>
  <meta name="theme-color" content="#141414">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/logo-static.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="vote-page">
  <div class="vote-head">
    <a href="index.html"><img src="assets/logo.svg" alt="musik scout"></a>
    <div class="lang mono"><button data-lang="en">EN</button><span class="dim">/</span><button data-lang="de">DE</button></div>
  </div>
  <main class="vote-main" id="app"></main>

  <script src="assets/data.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/vote.js"></script>
  <script>
  (function () {
    const V = window.MS_VOTE, app = document.getElementById("app");
    const ev = V.currentEvent();
    let state = "loading", picked = null, busy = false;
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const head = () => `<div class="mono"><span class="lime">${t("vote.kicker")}</span> · ${ev ? esc(ev.venue) + " · " + ev.date.split("-").reverse().join(".") : ""}</div>`;
    const notice = (k) => `${head()}<div class="notice" style="margin-top:22px"><h2>${t(k + ".t")}</h2><p>${t(k + ".p")}</p></div>`;

    function render() {
      msApplyI18n();
      if (!ev || state === "closed") { app.innerHTML = notice("vote.closed"); return; }
      if (state === "loading") { app.innerHTML = head(); return; }
      if (state === "thanks") { app.innerHTML = notice("vote.thanks"); return; }
      if (state === "already") { app.innerHTML = notice("vote.done"); return; }
      app.innerHTML = `${head()}
        <h1>${t("vote.title")}</h1>
        <p class="sub">${t("vote.sub")}</p>
        <div class="choices">${ev.live.map((a) => `<button class="choice" aria-pressed="${picked === a.name}" data-act="${esc(a.name)}">${esc(a.name)}<span class="dot"></span></button>`).join("")}</div>
        <button class="btn primary vote-submit" id="send" ${picked && !busy ? "" : "disabled"}>${t("vote.send")}</button>
        <p class="mono dim" id="err" style="margin-top:14px;font-size:.72rem"></p>`;
    }

    app.addEventListener("click", async (e) => {
      const c = e.target.closest(".choice");
      if (c) { picked = c.dataset.act; render(); return; }
      if (e.target.id === "send" && picked && !busy) {
        busy = true; render();
        try { state = await V.cast(ev, picked); if (state === "ok") state = "thanks"; }
        catch (err) { busy = false; render(); document.getElementById("err").textContent = t("vote.err"); return; }
        busy = false; render();
      }
    });
    document.addEventListener("ms:lang", render);

    if (V.DEMO) document.body.insertAdjacentHTML("beforeend", `<div class="demo-flag" data-i18n="vote.demo"></div>`);
    (async () => {
      if (!ev) return render();
      if (V.hasVoted(ev)) state = "already";
      else { try { state = (await V.isOpen(ev)) ? "open" : "closed"; } catch (e) { state = "closed"; } }
      render();
    })();
    render();
  })();
  </script>
</body>
</html>
