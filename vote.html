<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The game · musik scout</title>
  <meta name="theme-color" content="#121212">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/logo-static.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="vote-page">
  <div class="vote-head">
    <a href="index.html" class="vote-brand"><img src="assets/logo-static.svg" alt=""> musik scout</a>
    <div class="vote-tools"><a class="icon-btn" id="ig-top" href="#" target="_blank" rel="noopener" aria-label="Instagram"><svg class="ig" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.3" cy="6.7" r="1.3" fill="currentColor"/></svg></a><div class="lang mono"><button data-lang="en">EN</button><span class="dim">/</span><button data-lang="de">DE</button></div></div>
  </div>
  <main class="vote-main" id="app"></main>

  <script src="assets/data.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/db.js"></script>
  <script src="assets/wheel.js"></script>
  <script>
  (function () {
    const DB = window.MS_DB, app = document.getElementById("app");
    let ev = null, nextEv = null, state = "loading", picked = null, busy = false, mine = null, wheel = null, poll = null, clock = null;
    let insta = false, instaClicked = false;
    document.getElementById("ig-top").href = MS_DATA.instagram;
    const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const fmt = (iso) => iso.split("-").reverse().join(".");
    const IG_ICON = document.getElementById("ig-top").innerHTML;
    const head = () => `<div class="mono"><span class="lime">${t("vote.kicker")}</span>${ev ? " · " + esc(ev.venue) + " · " + fmt(ev.date) : ""}</div>`;

    const stay = () => `
      <div class="stay">
        <div class="mono dim">${t("vote.stay")}</div>
        ${nextEv ? `<a class="next-mini" href="index.html#next">
            <span class="mono lime">${t("vote.next")} · ${nextEv.weekday} ${fmt(nextEv.date)}</span>
            <strong>${nextEv.live.map((a) => esc(a.name)).join(" · ")}</strong>
            <span class="mono dim">${esc(nextEv.venue)}</span></a>` : ""}
        <div class="cta-row" style="margin-top:14px">
          <a class="btn primary" href="${esc(MS_DATA.instagram)}" target="_blank" rel="noopener">${t("vote.follow")}</a>
          <a class="btn" href="index.html">${t("vote.site")}</a>
        </div>
      </div>`;

    // Ticket nach der Abstimmung (mit laufender Uhr + Animation, damit ein Screenshot auffällt)
    function ticket() {
      const res = ev.spin_result, won = res && res === mine.genre;
      const status = !res ? `<p>${t("vote.ticket.p", { genre: esc(mine.genre) })}</p>`
        : `<h2 class="${won ? "lime" : ""}">${t(won ? "vote.win.t" : "vote.lose.t")}</h2><p>${t(won ? "vote.win.p" : "vote.lose.p", { genre: esc(res) })}</p>`;
      return `${head()}
        <div class="ticket ${won ? "won" : ""} ${res && !won ? "lost" : ""}">
          <div class="ticket-top"><span class="mono">${t("vote.ticket")}</span><span class="live-dot" aria-hidden="true"></span></div>
          <div class="ticket-genre">${esc(mine.genre)}</div>
          <div class="ticket-code mono">${mine.code ? "#" + esc(mine.code) + " · " : ""}${fmt(ev.date)}</div>
          <div class="ticket-status">${status}</div>
          <div class="ticket-clock mono" id="clock"></div>
        </div>
        ${stay()}`;
    }

    function render() {
      msApplyI18n();
      clearInterval(poll); clearInterval(clock); poll = clock = null;
      if (state === "loading") { app.innerHTML = head(); return; }
      if (!ev || state === "closed") {
        app.innerHTML = `${head()}<div class="notice" style="margin-top:22px"><h2>${t("vote.closed.t")}</h2><p>${t("vote.closed.p")}</p></div>${stay()}`;
        return;
      }
      if (state === "ticket") {
        app.innerHTML = ticket();
        const tick = () => { const c = document.getElementById("clock"); if (c) c.textContent = new Date().toLocaleTimeString("de-DE"); };
        tick(); clock = setInterval(tick, 1000);
        if (!ev.spin_result) poll = setInterval(refresh, 8000); // wartet auf das Rad
        return;
      }
      if (state === "gate") {
        // Hinweis vor dem Spiel: Instagram folgen (freiwillig, überspringbar)
        app.innerHTML = `${head()}
          <div class="gate">
            <div class="gate-logo"><img src="assets/brand/profile.png" alt=""></div>
            <div class="mono lime">${t("gate.kicker")}</div>
            <h1>${t("gate.title")}</h1>
            <p class="sub">${t("gate.p")}</p>
            <a class="btn primary gate-btn" id="gate-follow" href="${esc(MS_DATA.instagram)}" target="_blank" rel="noopener">${IG_ICON}<span>${t("gate.btn")}</span></a>
            ${instaClicked ? `<button class="btn gate-btn" id="gate-go">${t("gate.done")}</button>` : ""}
            <button class="gate-skip mono" id="gate-skip">${t("gate.skip")}</button>
          </div>`;
        return;
      }
      app.innerHTML = `${head()}
        <h1>${t("vote.title")}</h1>
        <p class="sub">${t("vote.sub")}</p>
        <div class="vote-wheel" id="wheel"></div>
        <button class="btn primary vote-submit" id="send" ${picked && !busy ? "" : "disabled"}>${picked ? t("vote.send") + " · " + esc(picked) : t("vote.pick")}</button>
        <p class="mono dim" id="err" style="margin-top:14px;font-size:.72rem"></p>`;
      wheel = MSWheel.create(document.getElementById("wheel"), {
        genres: ev.genres, interactive: true,
        onPick: (g) => { picked = g; const b = document.getElementById("send"); b.disabled = false; b.textContent = t("vote.send") + " · " + g; },
      });
      if (picked) wheel.set(picked);
    }

    async function refresh() {
      try {
        const fresh = await DB.getEvent(ev.id);
        if (fresh && fresh.spin_result !== ev.spin_result) { ev = fresh; render(); }
      } catch (e) {}
    }

    app.addEventListener("click", async (e) => {
      if (e.target.closest("#gate-follow")) { insta = true; instaClicked = true; setTimeout(render, 400); return; }
      if (e.target.closest("#gate-go") || e.target.closest("#gate-skip")) { state = "open"; render(); return; }
      if (e.target.id !== "send" || !picked || busy) return;
      busy = true; e.target.disabled = true;
      try {
        const r = await DB.cast(ev, picked, insta);
        if (r.status === "closed") state = "closed";
        else { mine = { genre: r.genre || picked, code: r.code || "" }; state = "ticket"; }
      } catch (err) {
        busy = false; render(); document.getElementById("err").textContent = t("vote.err"); return;
      }
      busy = false; render();
    });
    document.addEventListener("ms:lang", render);
    if (DB.DEMO) document.body.insertAdjacentHTML("beforeend", `<div class="demo-flag" data-i18n="vote.demo"></div>`);

    render();
    (async () => {
      try {
        const evs = await DB.listEvents();
        ev = await DB.currentEvent();
        if (ev) nextEv = evs.find((e) => e.date > ev.date && e.date >= DB.today()) || null;
        if (ev) mine = await DB.myVote(ev);
        state = !ev ? "closed" : mine ? "ticket" : ev.is_open ? "gate" : "closed";
      } catch (e) { state = "closed"; }
      render();
    })();
  })();
  </script>
</body>
</html>
