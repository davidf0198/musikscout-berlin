<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The wheel · musik scout</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#121212">
  <link rel="icon" href="assets/logo-static.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .spin-page { min-height: 100vh; display: grid; grid-template-columns: 1fr minmax(0, 92vh) 1fr; align-items: center; gap: 3vw; padding: 3vh 4vw; }
    .spin-left h1 { font-family: var(--mono); color: var(--lime); text-transform: uppercase; font-size: 5.4vw; line-height: .95; }
    .spin-left .mono { font-size: 1.2vw; }
    .spin-wheel { width: 100%; max-height: 94vh; aspect-ratio: 1; cursor: pointer; }
    .spin-right { align-self: stretch; display: flex; flex-direction: column; justify-content: space-between; text-align: right; }
    .spin-result { min-height: 30vh; display: flex; flex-direction: column; justify-content: center; gap: 1.5vh; }
    .spin-result .g { font-family: var(--mono); font-weight: 700; text-transform: uppercase; color: var(--lime); font-size: 6vw; line-height: 1; }
    .spin-result p { font-size: 1.6vw; line-height: 1.3; } .spin-result strong { color: var(--lime); text-transform: uppercase; }
    .spin-result.pop .g { animation: pop .6s cubic-bezier(.2,1.6,.4,1); }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } }
    .spin-qr { display: flex; gap: 1vw; align-items: center; justify-content: flex-end; }
    .spin-qr .qr { background: var(--ink); padding: 8px; border-radius: 10px; width: 13vh; height: 13vh; }
    .spin-qr .qr svg { width: 100%; height: 100%; }
    .spin-hint { font-size: 1vw; }
    .admin-flag { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: .7rem; padding: 4px 10px; border-radius: 99px; background: var(--bg-2); color: var(--ink-dim); }
  </style>
</head>
<!-- Glücksrad für den Beamer während des DJ-Sets. Leertaste oder Klick auf das Rad dreht.
     Ist man im Backstage angemeldet (gleicher Browser), wird das Ergebnis gespeichert:
     dann sehen alle Gäste auf ihrem Ticket, ob sie gewonnen haben. -->
<body>
  <div class="spin-page">
    <div class="spin-left">
      <div class="mono lime" id="meta"></div>
      <h1>The<br>game</h1>
      <div class="mono dim" style="margin-top:2vh" data-i18n="spin.hint"></div>
    </div>
    <div class="spin-wheel" id="wheel"></div>
    <div class="spin-right">
      <img src="assets/logo-static.svg" alt="" style="width:10vh;margin-left:auto">
      <div class="spin-result" id="result"></div>
      <div class="spin-qr"><div class="mono"><span data-i18n="res.scan"></span></div><div class="qr" id="qr"></div></div>
    </div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/db.js"></script>
  <script src="assets/qrcode.js"></script>
  <script src="assets/wheel.js"></script>
  <script>
  (async function () {
    const DB = window.MS_DB;
    msApplyI18n();
    const ev = await DB.currentEvent().catch(() => null);
    if (!ev) return;
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    document.getElementById("meta").textContent = `${ev.weekday} ${ev.date.split("-").reverse().join(".")} · ${ev.venue}`;
    const voteUrl = new URL("vote.html?e=" + encodeURIComponent(ev.id), location.href).href;
    const q = qrcode(0, "M"); q.addData(voteUrl); q.make();
    document.getElementById("qr").innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    if (DB.isAdmin()) document.body.insertAdjacentHTML("beforeend", `<div class="admin-flag">Backstage: Ergebnis wird gespeichert</div>`);

    const wheel = MSWheel.create(document.getElementById("wheel"), { genres: ev.genres, centerButton: true });
    const result = document.getElementById("result");
    const show = (g, pop) => {
      result.className = "spin-result" + (pop ? " pop" : "");
      result.innerHTML = g ? `<div class="g">${esc(g)}</div><p>${t("spin.win", { genre: esc(g) })}</p>` : "";
    };
    if (ev.spin_result) { wheel.set(ev.spin_result); show(ev.spin_result); }

    async function go() {
      if (wheel.spinning) return;
      show("");
      const g = await wheel.spin();
      show(g, true);
      if (DB.isAdmin()) { try { await DB.updateEvent(ev.id, { spin_result: g }); } catch (e) { console.error(e); } }
    }
    document.getElementById("wheel").addEventListener("click", go);
    document.addEventListener("keydown", (e) => { if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); go(); } });
    document.addEventListener("ms:lang", () => { msApplyI18n(); if (wheel.selected) show(wheel.selected); });
  })();
  </script>
</body>
</html>
