# Hält das kostenlose Supabase-Projekt wach (wird sonst nach 7 Tagen ohne Aktivität pausiert).
# Fragt zweimal pro Woche ein Event ab. Nutzt nur den öffentlichen anon-Key aus assets/config.js.
name: Supabase wach halten

on:
  schedule:
    - cron: "17 6 * * 1,4"   # Montag + Donnerstag, 06:17 UTC
  workflow_dispatch: {}       # manuell startbar unter "Actions"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase anpingen
        run: |
          URL=$(grep -oP 'supabaseUrl:\s*"\K[^"]*' assets/config.js)
          KEY=$(grep -oP 'supabaseAnonKey:\s*"\K[^"]*' assets/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase noch nicht eingerichtet – nichts zu tun."; exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/events?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Antwort: $code"
          [ "$code" = "200" ]
