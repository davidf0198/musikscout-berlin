<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vote your genre · musik scout</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/logo-static.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<!-- Für den Beamer/Screen am Abend. ?e=YYYY-MM-DD wählt das Event, ?hide=1 versteckt die Zahlen bis zur Auflösung. -->
<body class="results-page">
  <div class="results-top">
    <div>
      <div class="mono lime" id="meta" style="font-size:1.3vw;margin-bottom:1.5vh"></div>
      <h1>musik<br>scout</h1>
    </div>
    <div style="text-align:right">
      <img src="assets/logo.svg" alt="" style="width:16vh;margin-left:auto">
      <a class="mono dim" id="to-spin" href="#" style="font-size:1vw;display:inline-block;margin-top:1vh;text-decoration:none">→ wheel</a>
      <div class="mono" style="font-size:1.4vw;margin-top:1.5vh" data-i18n="res.title"></div>
    </div>
  </div>
  <div class="results-bars" id="bars"></div>
  <div class="results-foot">
    <div class="qr-box">
      <div class="qr" id="qr"></div>
      <div class="mono"><span data-i18n="res.scan"></span><br><span class="dim" id="url"></span></div>
    </div>
    <div class="mono"><span id="total">0</span> <span data-i18n="res.votes"></span></div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/db.js"></script>
  <script src="assets/qrcode.js"></script>
  <script>
  (async function () {
    const V = window.MS_DB;
    let ev = null; try { ev = await V.currentEvent(); } catch (e) {}
    const hide = new URLSearchParams(location.search).get("hide") === "1";
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    msApplyI18n();
    if (!ev) return;

    document.getElementById("meta").textContent = `${ev.weekday} ${ev.date.split("-").reverse().join(".")} · ${ev.venue}`;
    const voteUrl = new URL("vote.html?e=" + ev.id, location.href).href;
    document.getElementById("url").textContent = voteUrl.replace(/^https?:\/\//, "");
    const qr = qrcode(0, "M"); qr.addData(voteUrl); qr.make();
    document.getElementById("to-spin").href = "spin.html?e=" + encodeURIComponent(ev.id);
    document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });

    const bars = document.getElementById("bars");
    bars.innerHTML = ev.genres.map((g, i) => `<div class="bar-row" data-i="${i}"><div class="name genre">${esc(g)}</div><div class="bar-track"><div class="bar-fill"></div></div><div class="pct">–</div></div>`).join("");

    async function tick() {
      let r = {};
      try { r = await V.results(ev); } catch (e) { return; }
      const total = ev.genres.reduce((s, g) => s + (r[g] || 0), 0);
      const max = Math.max(0, ...ev.genres.map((g) => r[g] || 0));
      document.getElementById("total").textContent = total;
      ev.genres.forEach((g, i) => {
        const n = r[g] || 0, row = bars.children[i];
        const pct = total ? Math.round((n / total) * 100) : 0;
        row.querySelector(".bar-fill").style.width = hide ? "0%" : (total ? (n / max) * 100 : 0) + "%";
        row.querySelector(".pct").textContent = hide ? "?" : pct + "%";
        row.classList.toggle("lead", !hide && n > 0 && n === max);
      });
    }
    tick();
    setInterval(tick, 4000);
    window.addEventListener("storage", tick); // Demo-Modus: aktualisiert sofort, wenn im selben Browser abgestimmt wird
    document.addEventListener("ms:lang", msApplyI18n);
  })();
  </script>
</body>
</html>
